name: Gua UI tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Godot Gua tests
        uses: link1345/gua-tester@v1.3
        env:
          GUA_VISUAL_VARIANT: windows-godot-4.7-gl-compatibility
        with:
          project-path: .
          test-project: tests/GuaUiLab.Tests.csproj
          godot-version: "4.7"
          godot-status: stable
          gua-plugin-tag: gua-v0.15.0

      - name: Upload test diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: gua-test-diagnostics
          path: |
            **/TestResults/**
            **/artifacts/gua/**
          if-no-files-found: ignore
